<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map | Green Technology Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <nav class="container mx-auto flex justify-between items-center flex-wrap">
            <!-- Logo and Language on the LEFT -->
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-2xl font-bold text-emerald-600 rounded-lg p-2 transition-transform transform hover:scale-105">Green Tech</a>
                <div class="flex items-center space-x-2 border rounded-full p-1 bg-gray-100">
                    <select id="language-selector" class="p-1 bg-transparent text-sm focus:outline-none focus:ring-0">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            
            <!-- Nav Links on the RIGHT (Added Sustainability Goals) -->
            <div id="nav-links" class="flex flex-wrap gap-4 mt-2 sm:mt-0">
                <a href="index.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navHome">Home</a>
                <a href="why-it-matters.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navWhy">Why It Matters</a>
                <a href="blog.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navBlog">Blog</a>
                <a href="map.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Map</a>
                <a href="solutions.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Solutions</a>
                <!-- NEW Projects Link -->
                <a href="projects.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navProjects">Projects</a>
                <a href="sdg.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navSDG">Sustainability Goals</a>
                <a href="calculator.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Calculator</a>
                <a href="contact.html" class="nav-link px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-full transition-colors duration-300">Get Involved</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-4 sm:p-8">

        <!-- Page: Map -->
        <div id="page-map" class="page-content" >
            <section id="map-section" class="py-12 sm:py-16 text-center">
                <h2 data-lang-key="mapHeading" class="mt-8 inline-block px-8 py-4 bg-emerald-600 text-white font-bold rounded-full shadow-lg hover:bg-emerald-700 transition-colors duration-300 transform hover:scale-105">Map of Green Initiatives</h2>
                <br><br>
                <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-lg max-w-4xl mx-auto">
                    <p data-lang-key="mapSubheading" class="text-center text-gray-700 mb-4">
                        Explore major green projects, or search for a city to find local sustainable spots.
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-2 mb-4">
                        <input type="text" id="map-search-input" placeholder="Enter a city or location" class="flex-grow px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        
                        <select id="map-category-select" class="px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                            <option value="farmers market" data-lang-key="catFarmersMarket">Farmer's Markets</option>
                            <option value="solar power" data-lang-key="catSolarFarm">Solar Farms</option>
                            <option value="wind power" data-lang-key="catWindFarm">Wind Farms</option>
                            <option value="charging station" data-lang-key="catChargingStation">EV Charging Stations</option>
                        </select>
                        
                        <button id="map-search-button" class="px-6 py-2 bg-emerald-600 text-white font-semibold rounded-full hover:bg-emerald-700 transition-colors">
                            Search
                        </button>
                    </div>
                    <p id="map-search-status" class="text-sm text-center mb-4 h-5"></p> <!-- Status message for search -->

                    <div id="map"></div>
                </div>
            </section>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-8 rounded-t-3xl">
        <div class="container mx-auto text-center">
            <p data-lang-key="footerText" class="text-sm">&copy; 2023 Green Tech. All rights reserved.</p>
        </div>
    </footer>

    <!-- Leaflet JS for the map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="script.js"></script>
    <script src="map.js"></script>
</body>
</html>
