<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Green Technology Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <nav class="container mx-auto flex justify-between items-center flex-wrap">
            <!-- Logo and Language on the LEFT -->
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-2xl font-bold text-emerald-600 rounded-lg p-2 transition-transform transform hover:scale-105">Green Tech</a>
                <div class="flex items-center space-x-2 border rounded-full p-1 bg-gray-100">
                    <select id="language-selector" class="p-1 bg-transparent text-sm focus:outline-none focus:ring-0">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            
             <!-- Nav Links on the RIGHT (Added Sustainability Goals) -->
            <div id="nav-links" class="flex flex-wrap gap-4 mt-2 sm:mt-0">
                <a href="index.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navHome">Home</a>
                <a href="why-it-matters.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navWhy">Why It Matters</a>
                <a href="blog.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navBlog">Blog</a>
                <a href="map.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Map</a>
                <a href="solutions.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Solutions</a>
                <!-- NEW Projects Link -->
                <a href="projects.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navProjects">Projects</a>
                <a href="sdg.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300" data-lang-key="navSDG">Sustainability Goals</a>
                <a href="calculator.html" class="nav-link px-4 py-2 text-sm font-semibold text-gray-700 hover:text-white hover:bg-emerald-500 rounded-full transition-colors duration-300">Calculator</a>
                <a href="contact.html" class="nav-link px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-full transition-colors duration-300">Get Involved</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-4 sm:p-8">

        <!-- Page: Calculator -->
        <div id="page-calculator" class="page-content">
            <section id="calculator" class="py-12 sm:py-16">
                <h2 data-lang-key="calculatorHeading" class="text-3xl font-bold text-center text-emerald-800 mb-8 hero-title-gradient">Carbon Footprint Calculator</h2>
                <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-lg max-w-2xl mx-auto">
                    
                    <div class="space-y-6">
                        <!-- Transport -->
                        <div>
                            <label for="transport-km" class="block text-sm font-medium text-gray-700" data-lang-key="transportLabel">How many kilometers do you drive per week?</label>
                            <input type="number" id="transport-km" value="100" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500">
                        </div>

                        <!-- Energy -->
                        <div>
                            <label for="energy-kwh" class_block text-sm font-medium text-gray-700" data-lang-key="energyLabel">How much electricity do you use per month (in kWh)?</label>
                            <input type="number" id="energy-kwh" value="150" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500">
                        </div>

                        <!-- Diet -->
                        <div>
                            <label for="diet-type" class="block text-sm font-medium text-gray-700" data-lang-key="dietLabel">What is your primary diet?</label>
                            <select id="diet-type" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 bg-white">
                                <option value="1100" data-lang-key="dietVegan">Vegan</option>
                                <option value="1400" data-lang-key="dietVegetarian">Vegetarian</option>
                                <option value="2500" data-lang-key="dietOmnivore" selected>Omnivore</option>
                            </select>
                        </div>

                        <!-- Calculate Button -->
                        <div class="text-center">
                            <button id="calculate-footprint-btn" class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-full shadow-lg hover:bg-emerald-700 transition-colors duration-300 transform hover:scale-105" data-lang-key="calculateBtn">
                                Calculate My Footprint
                            </button>
                        </div>

                    </div>

                    <!-- Result Display -->
                    <div id="footprint-result-container" class="mt-8 text-center" style="display: none;">
                        <p class="text-lg text-gray-700" data-lang-key="resultPrefix">Your estimated annual footprint is:</p>
                        <p class="text-4xl font-extrabold text-emerald-700 my-2">
                            <span id="footprint-result-value">0.00</span> 
                            <span data-lang-key="resultSuffix">tonnes CO2e</span>
                        </p>
                        <p class="text-sm text-gray-500" data-lang-key="resultNote">This is a simplified estimate based on averages for India.</p>
                    </div>

                </div>
            </section>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-8 rounded-t-3xl">
        <div class="container mx-auto text-center">
            <p data-lang-key="footerText" class="text-sm">&copy; 2023 Green Tech. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
